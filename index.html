async function convertBase64ToUint8ArrayAsync(base64) {
    try {
        const res = await fetch("data:application/pdf;base64," + base64);
        const buf = await res.arrayBuffer();
        return new Uint8Array(buf);
    } catch (e) {
        const binaryString = window.atob(base64);
        const len = binaryString.length;
        const bytes = new Uint8Array(len);
        for (let i = 0; i < len; i++) {
            bytes[i] = binaryString.charCodeAt(i);
        }
        return bytes;
    }
}

// Cover image component for home cards
function MagazineCardCover({ magazine }) {
    const [coverUrl, setCoverUrl] = useState(magazine.cover || '');
    const [loadingCover, setLoadingCover] = useState(!magazine.cover);

    useEffect(() => {
        if (!coverUrl) {
            let isMounted = true;
            const renderThumb = async () => {
                try {
                    let pdfDoc;
                    if (window.magazinePdfData) {
                        const pdfData = await convertBase64ToUint8ArrayAsync(window.magazinePdfData);
                        pdfDoc = await window.pdfjsLib.getDocument({ data: pdfData }).promise;
                    } else if (magazine.pdfUrl) {
                        pdfDoc = await window.pdfjsLib.getDocument(magazine.pdfUrl).promise;
                    } else {
                        throw new Error("No PDF source available");
                    }
                    const page = await pdfDoc.getPage(1);
                    const viewport = page.getViewport({ scale: 0.5 });
                    const canvas = document.createElement('canvas');
                    canvas.width = viewport.width;
                    canvas.height = viewport.height;
                    const context = canvas.getContext('2d');
                    await page.render({ canvasContext: context, viewport: viewport }).promise;
                    if (isMounted) {
                        setCoverUrl(canvas.toDataURL());
                        setLoadingCover(false);
                    }
                } catch (err) {
                    console.error("Error rendering thumbnail:", err);
                    if (isMounted) {
                        setCoverUrl('https://placehold.co/400x550/eeeeee/333333?text=No+Cover');
                        setLoadingCover(false);
                    }
                }
            };
            renderThumb();
            return () => { isMounted = false; };
        }
    }, [magazine.pdfUrl]);

    if (loadingCover) {
        return (
            <div className="w-full h-full bg-gradient-to-br from-[#2a0409] via-[#4a0812] to-[#1a0205] flex flex-col items-center justify-center p-6 text-center border border-amber-500/20">
                <div className="w-10 h-10 rounded-full bg-amber-500/20 flex items-center justify-center text-amber-200 mb-2 animate-pulse">
                    <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>
                </div>
                <h4 className="font-serif text-xs font-bold text-amber-100">{magazine.title}</h4>
                <span className="text-[10px] text-amber-300/80 mt-1 uppercase tracking-wider">{magazine.date}</span>
            </div>
        );
    }

    return <img src={coverUrl} alt={magazine.title} className="w-full h-full object-cover" />;
}

// Flipbook Reader Modal Component
function FlipbookModal({ magazine, pdfUrl: directPdfUrl, onClose }) {
    const pdfUrl = magazine ? magazine.pdfUrl : directPdfUrl;
    const heyzineUrl = magazine ? magazine.heyzineUrl : null;

    const flipbookContainerRef = useRef(null);
    const wrapperRef = useRef(null);
    const flipRef = useRef(null);
    const pageThumbnailsRef = useRef([]);
    const [pageFlipInstance, setPageFlipInstance] = useState(null);
    const [loading, setLoading] = useState(false);
    const [error, setError] = useState(null);
    const [totalPages, setTotalPages] = useState(0);
    const [currentPage, setCurrentPage] = useState(1);
    
    // Feature state
    const [zoomScale, setZoomScale] = useState(1.0);
    const [pan, setPan] = useState({ x: 0, y: 0 });
    const [isDragging, setIsDragging] = useState(false);
    const [isPinching, setIsPinching] = useState(false);
    const lastPinchDist = useRef(0);
    // Unified HTML5 Double-tap / Double-click Zoom & Pan Handlers
    const lastTapTimeRef = useRef(0);
    const lastTapPosRef = useRef({ x: 0, y: 0 });
    const isDoubleTappingRef = useRef(false);
    const dragStartRef = useRef({ x: 0, y: 0, time: 0 });
    const isSwipingRef = useRef(false);

    const handlePointerDown = (e) => {
        const now = Date.now();
        const tapGap = now - lastTapTimeRef.current;
        const tapDx = Math.abs(e.clientX - lastTapPosRef.current.x);
        const tapDy = Math.abs(e.clientY - lastTapPosRef.current.y);

        // Detect double-tap (Mobile) and double-click (PC) natively
        if (tapGap > 30 && tapGap < 380 && tapDx < 35 && tapDy < 35) {
            lastTapTimeRef.current = 0;
            isDoubleTappingRef.current = true;
            
            // Toggle Zoom In (2.2x) & Zoom Out (1.0x)
            setZoomScale(prev => {
                const targetScale = prev > 1.05 ? 1.0 : 2.2;
                if (targetScale <= 1.0) setPan({ x: 0, y: 0 });
                return targetScale;
            });
            setIsDragging(false);

            setTimeout(() => {
                isDoubleTappingRef.current = false;
            }, 650);
            return;
        }

        lastTapTimeRef.current = now;
        lastTapPosRef.current = { x: e.clientX, y: e.clientY };

        if (zoomScale > 1.0) {
            setIsDragging(true);
            dragStartRef.current = { x: e.clientX, y: e.clientY, time: now };
        } else {
            dragStartRef.current = { x: e.clientX, y: e.clientY, time: now };
            isSwipingRef.current = true;
        }
    };
    const handlePointerMove = (e) => {
        if (isDragging && zoomScale > 1.0) {
            const dx = e.clientX - dragStartRef.current.x;
            const dy = e.clientY - dragStartRef.current.y;
            setPan(prev => ({ x: prev.x + dx, y: prev.y + dy }));
            dragStartRef.current = { x: e.clientX, y: e.clientY, time: Date.now() };
        }
    };
    const handlePointerUp = (e) => {
        setIsDragging(false);

        if (isSwipingRef.current && zoomScale <= 1.05) {
            isSwipingRef.current = false;
            
            if (isDoubleTappingRef.current) return;
            if (isPinchingRef.current) return;

            const dx = e.clientX - dragStartRef.current.x;
            const dy = e.clientY - dragStartRef.current.y;
            const dt = Date.now() - dragStartRef.current.time;

            if (dt < 600 && Math.abs(dx) > 60 && Math.abs(dy) < Math.abs(dx) * 1.5) {
                if (dx < 0) {
                    if (pageFlipInstance) try { pageFlipInstance.flipNext(); } catch(err) {}
                } else {
                    if (pageFlipInstance) try { pageFlipInstance.flipPrev(); } catch(err) {}
                }
            } else if (dt < 300 && Math.abs(dx) < 15 && Math.abs(dy) < 15) {
                if (!wrapperRef.current) return;
                const rect = wrapperRef.current.getBoundingClientRect();
                const x = e.clientX - rect.left;
                if (x < rect.width * 0.20) {
                    if (pageFlipInstance) try { pageFlipInstance.flipPrev(); } catch(err) {}
                } else if (x > rect.width * 0.80) {
                    if (pageFlipInstance) try { pageFlipInstance.flipNext(); } catch(err) {}
                }
            }
        }
    };

    // Native Pinch-Zoom Listeners for multi-touch pinch
    const zoomScaleRef = useRef(zoomScale);
    zoomScaleRef.current = zoomScale;
    const isPinchingRef = useRef(false);

    useEffect(() => {
        const wrapperEl = wrapperRef.current;
        if (!wrapperEl) return;

        const getTouchDist = (touches) => {
            const dx = touches[0].clientX - touches[1].clientX;
            const dy = touches[0].clientY - touches[1].clientY;
            return Math.sqrt(dx * dx + dy * dy);
        };

        const onNativeTouchStart = (e) => {
            if (e.touches.length >= 2) {
                isPinchingRef.current = true;
                setIsPinching(true);
                lastPinchDist.current = getTouchDist(e.touches);
            }
        };

        const onNativeTouchMove = (e) => {
            if (e.touches.length >= 2 && isPinchingRef.current) {
                const dist = getTouchDist(e.touches);
                const delta = dist - lastPinchDist.current;
                const scaleFactor = delta * 0.006;
                setZoomScale(prev => Math.min(Math.max(prev + scaleFactor, 1.0), 3.0));
                lastPinchDist.current = dist;
            }
        };

        const onNativeTouchEnd = (e) => {
            if (isPinchingRef.current && e.touches.length < 2) {
                isPinchingRef.current = false;
                setIsPinching(false);
                setZoomScale(prev => {
                    if (prev <= 1.15) {
                        setPan({ x: 0, y: 0 });
                        return 1.0;
                    }
                    return prev;
                });
            }
        };

        wrapperEl.addEventListener('touchstart', onNativeTouchStart, { passive: true });
        wrapperEl.addEventListener('touchmove', onNativeTouchMove, { passive: true });
        wrapperEl.addEventListener('touchend', onNativeTouchEnd, { passive: true });
        wrapperEl.addEventListener('touchcancel', onNativeTouchEnd, { passive: true });

        return () => {
            wrapperEl.removeEventListener('touchstart', onNativeTouchStart);
            wrapperEl.removeEventListener('touchmove', onNativeTouchMove);
            wrapperEl.removeEventListener('touchend', onNativeTouchEnd);
            wrapperEl.removeEventListener('touchcancel', onNativeTouchEnd);
        };
    }, []);

    const [showGrid, setShowGrid] = useState(false);
    const [showMoreMenu, setShowMoreMenu] = useState(false);
    const [showZoomTip, setShowZoomTip] = useState(true);
    const [toastMsg, setToastMsg] = useState('');
    const showToast = (msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(''), 3000);
    };
    const [isAutoPlay, setIsAutoPlay] = useState(false);

    // Auto Play Slideshow Logic
    React.useEffect(() => {
        let interval;
        if (isAutoPlay && pageFlipInstance) {
            interval = setInterval(() => {
                pageFlipInstance.flipNext();
            }, 3000); // Flips page every 3 seconds
        }
        return () => clearInterval(interval);
    }, [isAutoPlay, pageFlipInstance]);

    const [pageThumbnails, setPageThumbnails] = useState([]);
    const [loadProgress, setLoadProgress] = useState(0);

    useEffect(() => {
        if (!pdfUrl) return;

        let isMounted = true;
        setLoading(true);
        setError(null);
        setTotalPages(0);
        setCurrentPage(1);
        setZoomScale(1.0);
        setShowGrid(false);
        setShowMoreMenu(false);
        setLoadProgress(0);
        pageThumbnailsRef.current = [];

        const loadPDF = async () => {
            try {
                let pdfDoc;
                if (window.magazinePdfData) {
                    const pdfData = await convertBase64ToUint8ArrayAsync(window.magazinePdfData);
                    pdfDoc = await window.pdfjsLib.getDocument({ data: pdfData }).promise;
                } else {
                    pdfDoc = await window.pdfjsLib.getDocument(pdfUrl).promise;
                }
                if (!isMounted) return;
                
                setTotalPages(pdfDoc.numPages);
                
                // Exact page dimensions as confirmed by user: 1004px wide × 1358px tall per page.
                // Aspect ratio = 1358 / 1004 = 1.3526
                // pageWidth × pageHeight must match this exactly so canvas and container are identical.
                const PAGE_PDF_W = 1004;
                const PAGE_PDF_H = 1358;
                const pageWidth = 375;
                const pageHeight = Math.round(pageWidth * PAGE_PDF_H / PAGE_PDF_W); // = 507

                const pagesHtml = [];
                const initialThumbs = new Array(pdfDoc.numPages).fill('');

                // Create empty DOM elements for all pages immediately
                for (let i = 1; i <= pdfDoc.numPages; i++) {
                    const pageDiv = document.createElement('div');
                    pageDiv.className = 'page flex items-center justify-center bg-white';
                    
                    // Make the first and last pages "hard" covers so they don't fold and detach during opening/closing
                    if (i === 1 || i === pdfDoc.numPages) {
                        pageDiv.setAttribute('data-density', 'hard');
                    }
                    
                    // Add a tiny loading spinner inside the empty page
                    pageDiv.innerHTML = '<div class="text-stone-300 animate-pulse text-xs">Loading page...</div>';
                    pagesHtml.push(pageDiv);
                }

                if (flipbookContainerRef.current) {
                    flipbookContainerRef.current.innerHTML = '';
                    pagesHtml.forEach(div => flipbookContainerRef.current.appendChild(div));
                }

                setPageThumbnails(initialThumbs);

                // Helper to render a specific page
                // Use lower resolution on mobile to prevent GPU texture flickering
                const renderScale = window.innerWidth < 768 ? 1.0 : 1.5;
                
                const renderPage = async (pageNum) => {
                    if (!isMounted) return;
                    const pageDiv = pagesHtml[pageNum - 1];
                    if (pageDiv.querySelector('img')) return; // Already rendered

                    const page = await pdfDoc.getPage(pageNum);
                    const viewport = page.getViewport({ scale: renderScale });
                    const tempCanvas = document.createElement('canvas');
                    tempCanvas.width = viewport.width;
                    tempCanvas.height = viewport.height;
                    await page.render({ canvasContext: tempCanvas.getContext('2d'), viewport }).promise;
                    
                    // Convert canvas to a static <img> — mobile GPUs handle
                    // static images far better than live canvases during 3D rotation
                    const img = new Image();
                    img.src = tempCanvas.toDataURL('image/jpeg', 0.92);
                    img.style.width = '100%';
                    img.style.height = '100%';
                    img.style.display = 'block';
                    
                    img.onload = () => {
                        pageDiv.innerHTML = '';
                        pageDiv.appendChild(img);
                    };

                    // Thumbnail
                    const thumbCanvas = document.createElement('canvas');
                    thumbCanvas.width = Math.round(viewport.width * 0.15);
                    thumbCanvas.height = Math.round(viewport.height * 0.15);
                    thumbCanvas.getContext('2d').drawImage(tempCanvas, 0, 0, thumbCanvas.width, thumbCanvas.height);
                    if (pageThumbnailsRef.current) {
                        pageThumbnailsRef.current[pageNum - 1] = thumbCanvas.toDataURL();
                    }
                };

                // Load ALL pages fully before showing the book
                for (let i = 1; i <= pdfDoc.numPages; i++) {
                    if (!isMounted) break;
                    await renderPage(i);
                    setLoadProgress(Math.round((i / pdfDoc.numPages) * 100));
                }

                // Compute page dimensions from actual screen space
                const isMobile = window.innerWidth < 768;
                let fitPageW = pageWidth;
                let fitPageH = pageHeight;
                if (wrapperRef.current) {
                    const rect = wrapperRef.current.getBoundingClientRect();
                    // Use smaller outer margins on mobile to make the book as large as possible
                    const padX = isMobile ? 10 : 60; 
                    const padY = isMobile ? 20 : 80;
                    
                    const availW = rect.width - padX;
                    const availH = rect.height - padY;
                    const pageAspect = PAGE_PDF_H / PAGE_PDF_W;

                    if (isMobile) {
                        // Single page mode: page takes full width
                        fitPageW = Math.floor(availW);
                        fitPageH = Math.floor(fitPageW * pageAspect);
                    } else {
                        // Two-page spread: each page is half the width
                        fitPageW = Math.floor(availW / 2);
                        fitPageH = Math.floor(fitPageW * pageAspect);
                    }

                    if (fitPageH > availH) {
                        fitPageH = availH;
                        fitPageW = Math.floor(fitPageH / pageAspect);
                    }
                }

                if (flipRef.current) {
                    try { flipRef.current.destroy(); } catch(e) {}
                    flipRef.current = null;
                }

                const flip = new window.St.PageFlip(flipbookContainerRef.current, {
                    width: fitPageW,
                    height: fitPageH,
                    size: "fixed",
                    maxShadowOpacity: 0,
                    drawShadow: false,
                    showCover: true,
                    usePortrait: isMobile,
                    mobileScrollSupport: false,
                    flippingTime: 800,
                    swipeDistance: 120,
                    clickEventForward: false,
                    useMouseEvents: false, // Prevents all native touch conflicts and double-tap flip bugs
                    autoSize: false
                });

                flip.loadFromHTML(flipbookContainerRef.current.querySelectorAll('.page'));
                
                flip.on('flip', (e) => {
                    setCurrentPage(e.data + 1);
                });

                flipRef.current = flip;
                setPageFlipInstance(flip);
                setLoading(false);

            } catch (err) {
                if (isMounted) {
                    console.error("PDF Load Error:", err);
                    setError(err.message);
                    setLoading(false);
                }
            }
        };

        loadPDF();

        return () => {
            isMounted = false;
            if (flipRef.current) {
                try { flipRef.current.destroy(); } catch(e) {}
                flipRef.current = null;
            }
        };
    }, [pdfUrl]);



    useEffect(() => {
        const handleKeyDown = (e) => {
            if (e.key === 'ArrowLeft') {
                if (pageFlipInstance) pageFlipInstance.flipPrev();
            } else if (e.key === 'ArrowRight') {
                if (pageFlipInstance) pageFlipInstance.flipNext();
            } else if (e.key === 'Escape') {
                if (onClose) onClose();
            }
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
    }, [pageFlipInstance, onClose]);

    if (!pdfUrl) return null;

    const toggleFullscreen = () => {
        if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen().catch(err => console.error(err));
        } else {
            document.exitFullscreen();
        }
    };

    const handleDownload = async () => {
        if (window.magazinePdfData) {
            const bytes = await convertBase64ToUint8ArrayAsync(window.magazinePdfData);
            const blob = new Blob([bytes], { type: 'application/pdf' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'Gnan-Mandir-Magazine.pdf';
            a.click();
        } else {
            const a = document.createElement('a');
            a.href = pdfUrl;
            a.download = 'Gnan-Mandir-Magazine.pdf';
            a.click();
        }
    };

    const handleZoomIn = () => setZoomScale(prev => Math.min(prev + 0.25, 3.0));
    const handleZoomOut = () => setZoomScale(prev => Math.max(prev - 0.25, 1.0));

    const handlePrint = () => {
        window.open(pdfUrl, '_blank');
        showToast("Opening PDF for printing...");
    };

    const jumpToPage = (pageNum) => {
        if (pageFlipInstance) {
            pageFlipInstance.flip(pageNum - 1);
            setShowGrid(false);
        }
    };

    return (
        <div className="fixed inset-0 bg-[#120205] z-[1000] flex flex-col select-none touch-none overscroll-none">
            {/* Floating Double Tap Zoom Remark / Tip Badge */}
            {showZoomTip && !loading && (
                <div className="absolute top-4 left-1/2 -translate-x-1/2 bg-amber-500/95 text-stone-950 font-semibold px-4 py-2 rounded-full shadow-2xl z-[2000] border border-amber-300/40 text-xs sm:text-sm flex items-center gap-2.5">
                    <svg className="w-4 h-4 text-stone-900 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0zM10 7v6m3-3H7"/></svg>
                    <span>Double tap anywhere to zoom in & out</span>
                    <button 
                        onClick={() => setShowZoomTip(false)} 
                        className="ml-1 bg-black/15 hover:bg-black/30 text-stone-900 rounded-full p-1 transition-colors flex items-center justify-center"
                        title="Close tip"
                    >
                        <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"/></svg>
                    </button>
                </div>
            )}

            {/* Toast notification */}
            {toastMsg && (
                <div className="absolute top-16 left-1/2 -translate-x-1/2 bg-white text-zinc-900 px-6 py-2 rounded-full font-medium shadow-2xl z-[2000] border border-gray-200 text-sm">
                    {toastMsg}
                </div>
            )}

            {/* Top Close Button Bar */}
            <div className={`absolute top-2 right-2 z-30 ${loading ? 'hidden' : ''}`}>
                <button onClick={onClose} className="text-white/80 hover:text-white p-2 transition-colors">
                    <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
            </div>

            {/* Middle Section (Book Reader with Dedicated Side Page-Turn Handles) */}
            <div className="flex-1 min-h-0 flex items-center justify-between px-2 sm:px-4 relative overflow-hidden">
                {/* Left Outer Dedicated Page-Turn Handle removed as per request */}

                {/* Flipbook Container Wrapper with Panning Support */}
                <div 
                    ref={wrapperRef}
                    className={`flex-1 h-full min-h-0 flex items-center justify-center relative overflow-hidden ${zoomScale > 1 ? 'cursor-grab active:cursor-grabbing' : ''}`}
                    onPointerDown={handlePointerDown}
                    onPointerMove={handlePointerMove}
                    onPointerUp={handlePointerUp}
                    onPointerLeave={handlePointerUp}
                >
                    {loading && (
                        <div className="absolute flex flex-col items-center gap-3 text-white z-10">
                            <div className="text-xl font-light tracking-wider">
                                Loading Flipbook... <span className="font-semibold text-amber-300">{loadProgress}%</span>
                            </div>
                            <div className="w-72 bg-white/20 h-2.5 rounded-full overflow-hidden shadow-inner">
                                <div 
                                    className="bg-gradient-to-r from-amber-400 to-amber-200 h-full transition-all duration-200 ease-out rounded-full" 
                                    style={{ width: `${loadProgress}%` }}
                                ></div>
                            </div>
                        </div>
                    )}
                    {error && <div className="absolute text-red-400 text-center z-10">Error Loading PDF: <br/>{error}</div>}
                    
                    <div 
                        ref={flipbookContainerRef} 
                        className={`${loading || error ? 'hidden' : 'relative block shadow-2xl transition-transform duration-200'} ${zoomScale > 1 ? 'pointer-events-none' : ''}`}
                        style={{ 
                            transform: `translate(${pan.x}px, ${pan.y}px) scale(${zoomScale})`, 
                            transformOrigin: 'center center' 
                        }}
                    >
                    </div>
                </div>

                {/* Right Outer Dedicated Page-Turn Handle removed as per request */}
            </div>

            {/* Bottom Toolbar */}
            {!loading && !error && (
                <div className="h-12 flex-shrink-0 flex items-center justify-center z-30 relative">
                    <div className="bg-white/95 backdrop-blur-md px-6 py-2 flex justify-between items-center rounded-xl w-full max-w-3xl shadow-2xl border border-amber-900/10 relative">
                        {/* More Popup Menu */}
                        {showMoreMenu && (
                            <div className="absolute bottom-16 right-4 bg-white rounded-xl shadow-2xl p-2 border border-gray-200 flex flex-col gap-1 min-w-[160px] z-50 text-sm">
                                <button 
                                    onClick={() => { jumpToPage(1); setShowMoreMenu(false); }}
                                    className="px-4 py-2 hover:bg-gray-100 text-left rounded-lg text-gray-700 font-medium transition-colors"
                                >
                                    First Page (Cover)
                                </button>
                                <button 
                                    onClick={() => { jumpToPage(totalPages); setShowMoreMenu(false); }}
                                    className="px-4 py-2 hover:bg-gray-100 text-left rounded-lg text-gray-700 font-medium transition-colors"
                                >
                                    Last Page
                                </button>
                            </div>
                        )}

                        <div className="flex items-center gap-5 text-gray-600">
                            <button onClick={handleDownload} title="Download PDF" className="hidden sm:block hover:text-brand transition-colors">
                                <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
                            </button>
                            <button onClick={handlePrint} title="Print Magazine" className="hidden sm:block hover:text-brand transition-colors">
                                <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4H7v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"/></svg>
                            </button>
                            <div className="sm:hidden w-5"></div>
                        </div>
                        
                        <div className="flex items-center gap-4">
                            <button className="text-gray-600 hover:text-black" title="Previous Page" onClick={() => pageFlipInstance && pageFlipInstance.flipPrev()}>
                                <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 19l-7-7 7-7"/></svg>
                            </button>
                            <span className="text-xs font-semibold bg-stone-100 px-3 py-1 rounded-full text-zinc-800">
                                {currentPage} / {totalPages}
                            </span>
                            <button className="text-gray-600 hover:text-black" title="Next Page" onClick={() => pageFlipInstance && pageFlipInstance.flipNext()}>
                                <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 5l7 7-7 7"/></svg>
                            </button>
                        </div>

                        <div className="flex items-center gap-4 sm:gap-5 text-gray-600">
                            {/* Always visible on mobile & desktop */}
                            <button onClick={handleZoomIn} title="Zoom In" className="hover:text-black transition-colors">
                                <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0zM10 7v6m3-3H7"/></svg>
                            </button>
                            <button onClick={handleZoomOut} title="Zoom Out" className="hover:text-black transition-colors">
                                <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0zM13 10H7"/></svg>
                            </button>

                            {/* Hidden on mobile, visible on small screens and up */}
                            <button onClick={() => setIsAutoPlay(!isAutoPlay)} title="Auto Play" className={"hidden sm:block transition-colors " + (isAutoPlay ? "text-brand font-bold animate-pulse" : "hover:text-black")}>
                                <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"/><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                            </button>
                            <button onClick={toggleFullscreen} title="Toggle Fullscreen" className="hidden sm:block hover:text-black transition-colors">
                                <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"/></svg>
                            </button>
                            
                            {/* Always visible */}
                            <button onClick={() => { setPageThumbnails([...pageThumbnailsRef.current]); setShowGrid(!showGrid); }} title="Page Thumbnails" className={"transition-colors " + (showGrid ? "text-brand font-bold" : "hover:text-black")}>
                                <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/></svg>
                            </button>
                            <button onClick={() => setShowMoreMenu(!showMoreMenu)} title="More Options" className="hover:text-black transition-colors">
                                <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 12h.01M12 12h.01M19 12h.01M6 12a1 1 0 11-2 0 1 1 0 012 0zm7 0a1 1 0 11-2 0 1 1 0 012 0zm7 0a1 1 0 11-2 0 1 1 0 012 0z"/></svg>
                            </button>
                        </div>
                    </div>
                </div>
            )}

            {/* Grid / Thumbnail View Drawer Overlay */}
            {showGrid && (
                <div className="fixed inset-0 bg-black/85 backdrop-blur-lg z-[1500] flex flex-col p-8 transition-opacity duration-300">
                    <div className="flex justify-between items-center mb-6 max-w-7xl mx-auto w-full">
                        <h3 className="text-white text-xl font-medium font-serif">All Pages ({totalPages})</h3>
                        <button onClick={() => setShowGrid(false)} className="text-white hover:text-gray-300 p-2">
                            <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"/></svg>
                        </button>
                    </div>

                    <div className="flex-1 overflow-y-auto grid grid-cols-2 sm:grid-cols-4 md:grid-cols-6 lg:grid-cols-8 gap-6 p-4 max-w-7xl mx-auto w-full">
                        {pageThumbnails.map((thumb, idx) => (
                            <div 
                                key={idx} 
                                onClick={() => jumpToPage(idx + 1)}
                                className={`cursor-pointer group flex flex-col items-center p-2 rounded-xl transition-all ${currentPage === idx + 1 ? 'bg-brand/40 ring-2 ring-amber-400' : 'hover:bg-white/10'}`}
                            >
                                <img src={thumb} alt={`Page ${idx + 1}`} className="w-full rounded-lg shadow-md group-hover:scale-105 transition-transform" />
                                <span className="text-xs text-stone-300 mt-2 font-medium">Page {idx + 1}</span>
                            </div>
                        ))}
                    </div>
                </div>
            )}
        </div>
    );
}

class ErrorBoundary extends React.Component {
    constructor(props) {
        super(props);
        this.state = { hasError: false, errorMsg: '' };
    }
    static getDerivedStateFromError(error) {
        return { hasError: true, errorMsg: error.toString() };
    }
    componentDidCatch(error, errorInfo) {
        console.error("React Error Boundary Caught:", error, errorInfo);
    }
    render() {
        if (this.state.hasError) {
            return (
                <div className="flex flex-col items-center justify-center min-h-screen bg-[#120205] text-white p-6 text-center">
                    <h2 className="text-xl font-bold text-amber-300 mb-2">Notice</h2>
                    <p className="text-sm text-stone-300 mb-2">An internal issue occurred while rendering the page.</p>
                    <p className="text-xs text-red-300 mb-6 font-mono bg-black/30 p-2 rounded max-w-lg truncate">{this.state.errorMsg}</p>
                    <p className="text-sm text-stone-300 mb-4">Tap to refresh the library.</p>
                    <button onClick={() => window.location.reload()} className="bg-amber-500 text-zinc-950 font-bold px-6 py-2.5 rounded-xl shadow-lg">
                        Refresh Page
                    </button>
                </div>
            );
        }
        return this.props.children;
    }
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(
    <ErrorBoundary>
        <App />
    </ErrorBoundary>
);
    </script>
</body>
</html>
